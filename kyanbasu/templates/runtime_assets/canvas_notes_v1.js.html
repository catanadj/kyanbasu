    if(parentId) clonedLinks.push({from:parentId,to:idMap[root.id],type:'child'});
    var nextNotes=notes.concat(copies),validIds=Object.create(null);
    nextNotes.forEach(function(note){validIds[note.id]=true;});
    var candidate=NoteCore.sanitizeLinks(links.concat(clonedLinks),validIds);
    if(candidate.dropped) return {ok:false,rootId:null,idMap:{},reason:'The copied branch does not form a valid graph.'};
    for(var li=0;li<clonedLinks.length;li++) if(!globalMutationAllowed('link.create',clonedLinks[li])) return {ok:false,rootId:null,idMap:{},reason:'A copied link is not authorized.'};
    var apply=function(){
      notes=nextNotes;links=candidate.links;
      var ordered=siblingsForParent(parentId).filter(function(note){return note.id!==idMap[root.id];});
      ordered.splice(Math.max(0,sourceIndex+1),0,noteById(idMap[root.id]));
      ordered.forEach(function(note,index){note.outlineOrder=index;});
      selectNote(idMap[root.id]);renderAll();refreshViewerOutline();focusNoteText(idMap[root.id]);saveSoon();
      return {ok:true,rootId:idMap[root.id],idMap:idMap};
    };
    var result=window.KyanbasuHistory&&typeof window.KyanbasuHistory.transaction==='function'?window.KyanbasuHistory.transaction('duplicate note branch',apply):apply();
    return result&&result.ok?result:{ok:false,rootId:null,idMap:{},reason:(result&&result.reason)||'Branch duplication was rolled back.'};
  }
  function mergePlan(ids,survivorId){
    ids=Array.isArray(ids)?ids.map(function(id){return String(id||'');}).filter(Boolean):[];
    ids=ids.filter(function(id,index){return ids.indexOf(id)===index;});
    if(ids.length<2) return {ok:false,reason:'Select at least two notes.'};
    var selected=ids.map(noteById);
    if(selected.some(function(note){return !note;})) return {ok:false,reason:'A selected note no longer exists.'};
    var parent=parentLinkFor(selected[0].id),parentId=parent?parent.from:null;
    for(var i=0;i<selected.length;i++){
      var note=selected[i],parentLink=parentLinkFor(note.id);
      if((parentLink?parentLink.from:null)!==parentId) return {ok:false,reason:'Notes must have the same parent.'};
      if(noteBucket(note)!==noteBucket(selected[0])) return {ok:false,reason:'Notes must be in the same bucket.'};
      if(noteKind(note)!==noteKind(selected[0])) return {ok:false,reason:'Notes must have the same thinking role.'};
      if(structuralEditProtected(note)) return {ok:false,reason:'Guided decision notes cannot be merged.'};
      var descendants=branchSubtreeIds(note.id);
      for(var d=1;d<descendants.length;d++) if(ids.indexOf(descendants[d])!==-1) return {ok:false,reason:'Ancestor and descendant notes cannot be merged together.'};
    }
    if(ids.some(function(id){return parentId===id;})) return {ok:false,reason:'Ancestor and descendant notes cannot be merged together.'};
    if(ids.indexOf(String(survivorId||''))===-1) return {ok:false,reason:'Choose one selected note to keep.'};
    var order=siblingsForParent(parentId).filter(function(note){return ids.indexOf(note.id)!==-1;});
    var orderedIds=order.map(function(note){return note.id;}),absorbed=ids.filter(function(id){return id!==survivorId;}),removed=Object.create(null);
    absorbed.forEach(function(id){removed[id]=true;});
    var refs=[],seenRefs=Object.create(null);
    order.forEach(function(note){
      noteTaskRefs(note).forEach(function(ref){
        var key=ref.uuid?'uuid:'+ref.uuid:(ref.short?'short:'+ref.short:'');
        if(!key||seenRefs[key]) return;seenRefs[key]=true;refs.push(cloneValue(ref));
      });
    });
    var content=order.map(function(note){return String(note.content||'');}).filter(function(text){return !!text.trim();}).join('\n\n');
    var candidateLinks=[], byKey=Object.create(null), byEndpoints=Object.create(null), childOrder=[], endpointConflict=false;
    order.forEach(function(note){siblingsForParent(note.id).forEach(function(child){if(childOrder.indexOf(child.id)===-1)childOrder.push(child.id);});});
    links.forEach(function(link){
      if(!link) return;
      var from=removed[link.from]?survivorId:link.from, to=removed[link.to]?survivorId:link.to;
      if(from===to) return;
      var next={from:from,to:to,type:link.type};
      var annotation=NoteCore.normalizeLinkAnnotation(link.annotation);
      if(annotation) next.annotation=annotation;
      var key=[from,to,NoteCore.normalizeRelation(link.type)].join('::');
      var endpoint=[from,to].join('::');
      if(byEndpoints[endpoint]&&byEndpoints[endpoint]!==key){endpointConflict=true;return;}
      byEndpoints[endpoint]=key;
      if(byKey[key]){
        var prior=byKey[key],priorAnnotation=prior.annotation?JSON.stringify(prior.annotation):'null',nextAnnotation=next.annotation?JSON.stringify(next.annotation):'null';
        if(priorAnnotation!==nextAnnotation) byKey[key].conflict=true;
        return;
      }
      byKey[key]=next;candidateLinks.push(next);
    });
    var conflict=Object.keys(byKey).some(function(key){return byKey[key].conflict;});
    if(conflict) return {ok:false,reason:'Conflicting link annotations would be combined. Reconcile those links before merging.'};
    if(endpointConflict||Object.keys(byEndpoints).length!==candidateLinks.length) return {ok:false,reason:'The merge would combine different link types on the same note pair.'};
    var remaining=notes.filter(function(note){return !removed[note.id];}),validIds=Object.create(null);
    remaining.forEach(function(note){validIds[note.id]=true;});
    var sanitized=NoteCore.sanitizeLinks(candidateLinks,validIds);
    if(sanitized.dropped) return {ok:false,reason:'The merged notes would create an invalid link graph.'};
    return {ok:true,survivorId:survivorId,orderedIds:orderedIds,content:content,taskRefs:refs,
      parentId:parentId,absorbedIds:absorbed,remaining:remaining,links:sanitized.links,childOrder:childOrder};
  }
  function validateMerge(ids,survivorId){
    var plan=mergePlan(ids,survivorId);
    return plan.ok?{ok:true,survivorId:plan.survivorId,orderedIds:plan.orderedIds,preview:plan.content,reason:''}:{ok:false,reason:plan.reason};
  }
  function mergeNotes(ids,survivorId){
    var plan=mergePlan(ids,survivorId);
    if(!plan.ok) return {ok:false,survivorId:survivorId||null,reason:plan.reason};
    if(!globalMutationAllowed('note.merge',{ids:plan.orderedIds,survivorId:plan.survivorId})) return {ok:false,survivorId:survivorId,reason:'Merge is not authorized.'};
    var survivor=noteById(plan.survivorId), now=Date.now();
    var apply=function(){
      survivor.content=plan.content;survivor.taskRefs=plan.taskRefs;survivor.updatedAt=now;survivor.reviewedAt=0;
      notes=plan.remaining;links=plan.links;
      var childIds=[];
      var directChildren=plan.childOrder.filter(function(id){return links.some(function(link){return link.type==='child'&&link.from===plan.survivorId&&link.to===id;});});
      directChildren.forEach(function(id,index){var child=noteById(id);if(child)child.outlineOrder=index;});
      renumberOutlineGroup(plan.parentId);
      renderAll();selectNote(plan.survivorId);refreshViewerOutline();saveSoon();
      return {ok:true,survivorId:plan.survivorId};
    };
    var result=window.KyanbasuHistory&&typeof window.KyanbasuHistory.transaction==='function'?window.KyanbasuHistory.transaction('merge notes',apply):apply();
    return result&&result.ok?result:{ok:false,survivorId:survivorId,reason:(result&&result.reason)||'Merge was rolled back.'};
  }
